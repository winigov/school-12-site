<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Амина</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#FBFAF6;--surface:#FFFFFF;--surface-2:#EAF0F8;--ink:#1A1A1A;--ink-2:#393939;--muted:#6B6B6B;--lapis:#2D63A6;--on-lapis:#FFFFFF;--gold:#8B6B22;--terra:#C24E1E;--line:#D9DDE3;--band-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#141516;--surface:#1C1E21;--surface-2:#1E2936;--ink:#EDEBE6;--ink-2:#CFCBC3;--muted:#9A968F;--lapis:#79A6E0;--on-lapis:#10141A;--gold:#D9B45A;--terra:#F0875A;--line:#30343A;--band-ink:#10141A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PT Serif",Georgia,serif;font-size:18px;line-height:1.55}
a{color:var(--lapis)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{background:var(--lapis)}
.top-inner{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;font-family:"PT Sans","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--band-ink);flex-wrap:wrap}
.top-inner a{color:var(--band-ink);text-decoration:none;border:1px solid var(--band-ink);padding:5px 10px;border-radius:3px}
.top-inner b{color:var(--band-ink);font-weight:700}
main{max-width:720px;margin:0 auto;padding:36px 16px 80px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:"PT Sans","Segoe UI",system-ui,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tess{display:none}
h1{font-family:"PT Sans Narrow","Arial Narrow",sans-serif;font-weight:700;color:var(--lapis);line-height:1.02;margin:8px 0 0;font-size:clamp(38px,9vw,56px);text-wrap:balance}
.lede{color:var(--ink-2);margin:10px 0 0;max-width:40ch}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:520px){.grid.two{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lapis);padding:18px 20px;transition:border-color .15s}
.card:hover{border-color:var(--lapis)}
.card .name{font-family:"PT Sans Narrow","Arial Narrow",sans-serif;font-weight:700;font-size:36px;line-height:1;color:var(--lapis)}
.card .sub{color:var(--ink-2);font-size:16px}
.card .cnt{font-family:"PT Sans","Segoe UI",system-ui,sans-serif;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);font-weight:700;margin-top:4px}
.toc-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.toc-row{display:flex;align-items:baseline;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.toc-row .par{font:700 18px/1 "PT Sans Narrow","Arial Narrow",sans-serif;color:var(--lapis);width:2em;flex:none;white-space:nowrap}
.toc-row .ttl{flex:1;min-width:0;color:var(--lapis);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;font-size:16.5px;line-height:1.35}
.toc-row:hover .ttl{text-decoration-thickness:2px}
.toc-row:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toc-row .pg{font-family:"PT Sans","Segoe UI",system-ui,sans-serif;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);padding:18px 20px}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a href="../">Школа №12</a> <span>·</span> <b>Амина</b></div></header>
<main>
<header><div class="eyebrow"><span class="tess"><i></i><i></i><i></i></span> 6 класс</div><h1>Амина</h1><p class="lede">Выбери предмет.</p></header><div class="grid two"><a class="card" href="istoriya/"><span class="name">История</span><span class="cnt">5 тем</span></a></div>
</main>
</body>
</html>
