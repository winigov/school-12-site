<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Разборы для Амины и Арслана</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EBE8DF;--surface:#F8F6F0;--surface-2:#E2DED2;--ink:#1B2233;--ink-2:#4A5163;--muted:#7A8093;--lapis:#23448A;--gold:#B08A2E;--gold-soft:#F1E6C2;--terra:#B4552F;--line:#D2CDBF;
  --shadow:0 1px 2px rgba(27,34,51,.08),0 10px 28px rgba(27,34,51,.07)}
@media (prefers-color-scheme: dark){:root{--bg:#0F1728;--surface:#182338;--surface-2:#21304B;--ink:#EDE8DC;--ink-2:#C2BFB4;--muted:#8B93A8;--lapis:#7EA0E6;--gold:#E0B84A;--gold-soft:#3E3419;--terra:#E0825C;--line:#2E3B57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.5}
a{color:var(--lapis)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top-inner{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.top-inner a{color:var(--ink-2);text-decoration:none;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.top-inner b{color:var(--ink);font-weight:600}
main{max-width:720px;margin:0 auto;padding:36px 16px 80px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:10px}
.tess{display:inline-flex;gap:3px}.tess i{width:8px;height:8px;display:block;border-radius:1px}
.tess i:nth-child(1){background:var(--lapis)}.tess i:nth-child(2){background:var(--gold)}.tess i:nth-child(3){background:var(--terra)}
h1{font-family:"Oranienbaum","Georgia",serif;font-weight:400;line-height:1.05;margin:8px 0 0;font-size:clamp(36px,8vw,56px);text-wrap:balance}
.lede{color:var(--ink-2);margin:10px 0 0;max-width:40ch}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:520px){.grid.two{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--lapis);transform:translateY(-1px)}
.card .name{font-family:"Oranienbaum","Georgia",serif;font-size:36px;line-height:1}
.card .sub{color:var(--ink-2);font-size:15px}
.card .cnt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:4px}
.topic{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--lapis)}
.topic .par{font-family:"Oranienbaum","Georgia",serif;font-size:30px;color:var(--gold);line-height:1;grid-row:1/3}
.topic .ttl{font-weight:600;font-size:18px;line-height:1.25}
.topic .desc{color:var(--ink-2);font-size:14.5px;line-height:1.35}
.topic .meta{grid-column:2;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px 20px}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><b>Школа №12</b></div></header>
<main>
<header><div class="eyebrow"><span class="tess"><i></i><i></i><i></i></span> Школа №12 · Каспийск</div><h1>Кто сегодня учится?</h1><p class="lede">Темы из учебников, объяснённые простыми словами, с играми и проверкой.</p></header><div class="grid two"><a class="card" href="amina/"><span class="name">Амина</span><span class="sub">6 класс</span><span class="cnt">4 темы</span></a><a class="card" href="arslan/"><span class="name">Арслан</span><span class="sub">4 класс</span><span class="cnt">пока нет тем</span></a></div>
</main>
</body>
</html>
